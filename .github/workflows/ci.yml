name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Ejecuta también el postinstall (prisma generate).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Placeholders: el build no se conecta a estos servicios, solo necesita
          # que las variables existan para instanciar clientes (Prisma/Auth).
          DATABASE_URL: postgresql://user:password@localhost:5432/db?sslmode=require
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-in-runtime
          BETTER_AUTH_URL: http://localhost:3000
          CLOUDINARY_CLOUD_NAME: ci
          CLOUDINARY_API_KEY: ci
          CLOUDINARY_API_SECRET: ci
          RESEND_API_KEY: ci
          EMAIL_FROM: ci@example.com
